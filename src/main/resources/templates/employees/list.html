<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List Employees</title>
</head>
<body>
<ul>
    <li th:each="employee : ${employees}">
        <span th:text="${employee.name}">Employee Name</span> -
        <span th:text="${employee.email}">Employee Email</span> -
        <span th:text="${employee.department}">Employee Department</span>
    </li>
</ul>
</body>
</html>
